name: Bug Report
description: Report a bug with the Stackweaver Helm chart
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Share only information you can make public. Use synthetic values.
        For a suspected vulnerability, follow the
        [Stackweaver security policy](https://github.com/vhco-pro/stackweaver-frontend/security/policy).

  - type: input
    id: chart-version
    attributes:
      label: Chart version
      description: Which version of the Helm chart are you using?
      placeholder: e.g. 0.0.3
    validations:
      required: true

  - type: input
    id: kubernetes-version
    attributes:
      label: Kubernetes version
      description: "Enter only the Kubernetes server version."
      placeholder: e.g. 1.30.2
    validations:
      required: true

  - type: input
    id: helm-version
    attributes:
      label: Helm version
      description: "Output of `helm version --short`."
      placeholder: e.g. v3.16.1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Install the chart with `helm install ...`
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened. Include a short sanitized error excerpt if it helps.
    validations:
      required: true

  - type: textarea
    id: values
    attributes:
      label: Synthetic values excerpt
      description: Share only the few lines needed to show the problem. Replace cluster names, hostnames, endpoints, and credentials with placeholders.
      render: yaml

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share any public links or synthetic details that help explain the problem.
