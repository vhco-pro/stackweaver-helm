name: Feature Request
description: Suggest a new feature or improvement for the Helm chart
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic values in your examples and remove deployment details.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Share only the few lines needed to show the problem. Replace cluster names, hostnames, endpoints, and credentials with placeholders.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've considered or workarounds you're currently using.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, links, or references.
