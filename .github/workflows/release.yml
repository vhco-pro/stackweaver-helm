name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # README bump + GitHub Release
      packages: write       # GHCR push
      id-token: write       # Sigstore OIDC for cosign keyless
      attestations: write   # actions/attest-* (only effective when public)
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Docker-style login writes ~/.docker/config.json, which both helm registry
      # operations AND cosign sign / cosign attest pick up. The earlier
      # 'helm registry login' wrote to ~/.config/helm/registry/config.json,
      # which cosign does not read — leading to UNAUTHORIZED on signature push.
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: vhco-pro
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Set chart version + appVersion from git tag
          sed -i "s/^version:.*/version: ${VERSION}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" chart/Chart.yaml
          helm package chart/

      - name: Push to GHCR + capture digest
        id: push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # helm push prints "Digest: sha256:..." on success; capture for cosign
          helm push "stackweaver-${VERSION}.tgz" oci://ghcr.io/vhco-pro/charts 2>&1 | tee push.log
          DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | head -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not extract sha256 digest from helm push output"
            exit 1
          fi
          REF="ghcr.io/vhco-pro/charts/stackweaver@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tarball=stackweaver-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "::notice::Published ${REF}"

      - name: Cosign sign chart (Sigstore keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.push.outputs.ref }}"

      - name: Generate SBOM (SPDX) for the chart tarball
        env:
          TARBALL: ${{ steps.push.outputs.tarball }}
        run: syft scan "file:${TARBALL}" -o spdx-json=sbom.spdx.json

      - name: Cosign attest SBOM (Sigstore keyless)
        env:
          COSIGN_YES: "true"
        run: cosign attest --predicate sbom.spdx.json --type spdx "${{ steps.push.outputs.ref }}"

      - name: Cosign attest OpenVEX (Sigstore keyless)
        if: ${{ hashFiles('security/vex/stackweaver-helm.openvex.json') != '' }}
        env:
          COSIGN_YES: "true"
        run: cosign attest --predicate security/vex/stackweaver-helm.openvex.json --type openvex "${{ steps.push.outputs.ref }}"

      # GitHub-native attestations require GitHub Advanced Security on private
      # repos. They are skipped on private satellites and auto-activate on
      # the Wave-6 visibility flip (no further edit needed).
      - name: Attest build provenance (SLSA L3)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/vhco-pro/charts/stackweaver
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (SPDX)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/vhco-pro/charts/stackweaver
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Update README version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|--version [0-9]\+\.[0-9]\+\.[0-9]\+|--version ${VERSION}|g" README.md
          git add README.md
          git commit -m "chore: update README to ${VERSION} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed"

      - name: Download SLSA provenance bundle
        if: ${{ github.event.repository.visibility == 'public' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation download \
            "oci://ghcr.io/vhco-pro/charts/stackweaver@${DIGEST}" \
            --predicate-type https://slsa.dev/provenance/v1 \
            -R "${{ github.repository }}" || { echo "::warning::SLSA provenance download failed"; exit 0; }
          f=$(ls -1 *.jsonl 2>/dev/null | head -1 || true)
          if [ -n "${f}" ]; then mv "${f}" provenance.intoto.jsonl; fi

      - name: Download SPDX SBOM bundle
        if: ${{ github.event.repository.visibility == 'public' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation download \
            "oci://ghcr.io/vhco-pro/charts/stackweaver@${DIGEST}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            -R "${{ github.repository }}" || { echo "::warning::SBOM download failed"; exit 0; }
          f=$(ls -1 *.jsonl 2>/dev/null | grep -v '^provenance.intoto.jsonl$' | head -1 || true)
          if [ -n "${f}" ]; then mv "${f}" sbom.spdx.intoto.jsonl; fi

      - name: Generate checksums
        if: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          if ls *.intoto.jsonl 1>/dev/null 2>&1; then
            sha256sum *.intoto.jsonl > checksums.txt
            cat checksums.txt
          fi

      - name: Attach assets to GitHub Release
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            provenance.intoto.jsonl
            sbom.spdx.intoto.jsonl
            checksums.txt
            ${{ steps.push.outputs.tarball }}
          fail_on_unmatched_files: false

      - name: Changelog & GitHub Release
        uses: michielvha/changelog-release-action@81984f615bdcb8f88bbf92f49cae8d70f0fce099 # main snapshot 2026-05-23
        with:
          version: ${{ github.ref_name }}
          type: helm
