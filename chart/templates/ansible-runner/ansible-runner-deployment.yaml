apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackweaver.fullname" . }}-ansible-runner
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: ansible-runner
spec:
  replicas: {{ .Values.ansibleRunner.replicas }}
  selector:
    matchLabels:
      {{- include "stackweaver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ansible-runner
  template:
    metadata:
      labels:
        {{- include "stackweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ansible-runner
        {{- if .Values.ansibleRunner.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.ansibleRunner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "stackweaver.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "stackweaver.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ansible-runner
          image: "{{ .Values.ansibleRunner.image.repository }}:{{ .Values.ansibleRunner.image.tag }}"
          imagePullPolicy: {{ .Values.ansibleRunner.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            # Defense-in-depth: the runner needs no Linux capabilities (privilege
            # escalation for Ansible "become" happens on the target host over SSH,
            # not in this container), so drop them all and forbid regaining any.
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: LOG_LEVEL
              value: info
            # ── Database ──
            {{- include "stackweaver.env.database" . | nindent 12 }}
            # ── Redis ──
            {{- include "stackweaver.env.redis" . | nindent 12 }}
            # ── Storage ──
            {{- include "stackweaver.env.storage" . | nindent 12 }}
            # ── Encryption ──
            {{- include "stackweaver.env.encryption" . | nindent 12 }}
            # ── OIDC Workload Identity ──
            # Only set when explicitly configured. Do NOT fall back to the API URL:
            # that produces a {host}/api/v2 issuer, but external verifiers (Azure
            # Entra) fetch {issuer}/.well-known/openid-configuration, served only at
            # the ingress root. A missing issuer leaves this unset so the runner uses
            # its localhost default and warns loudly if an auth_method=oidc Azure
            # inventory actually needs it - rather than minting a doomed /api/v2 token.
            {{- if .Values.oidc.issuerUrl }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            {{- end }}
            - name: OIDC_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.oidc" . }}
                  key: {{ .Values.secrets.oidc.keys.signingKey }}
                  optional: true
            # ── Workspaces ──
            - name: WORKSPACES_DIR
              value: /home/iac/workspaces
            # ── Ansible ──
            # Default home under the writable /tmp emptyDir so Ansible can create
            # its local temp dir under the read-only root filesystem. The runner
            # overrides this per-job/per-sync onto the workspaces volume.
            - name: ANSIBLE_HOME
              value: /tmp/.ansible
            # Module "remote" temp dir. For local-connection tasks the target is
            # this read-only container, so it must live under writable /tmp.
            - name: ANSIBLE_REMOTE_TMP
              value: /tmp/.ansible/tmp
            # ── Extra env vars (user overrides) ──
            {{- range $key, $value := .Values.ansibleRunner.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            # Per-job scratch (playbook checkout, inventory, staged credentials).
            # Ephemeral and isolated from the terraform runner - it holds no run
            # history (output/status/events live in Postgres + object storage).
            - name: workspaces
              mountPath: /home/iac/workspaces
            # Dedicated per-project Ansible Galaxy cache, nested under the scratch
            # mount at the path the runner derives (WORKSPACES_DIR/galaxy-cache).
            # A regenerable performance cache, kept off the shared runner volume.
            - name: galaxy-cache
              mountPath: /home/iac/workspaces/galaxy-cache
            - name: tmp
              mountPath: /tmp
            {{- include "stackweaver.customCA.volumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ansibleRunner.resources | nindent 12 }}
      volumes:
        # Ephemeral per-job scratch. Not the shared runner-workspaces PVC: the
        # ansible runner cleans job dirs per run and keeps no durable data here,
        # so an emptyDir gives full isolation from the terraform runner with no
        # data-loss surface and no dependency on RWX storage.
        - name: workspaces
          emptyDir:
            sizeLimit: {{ .Values.ansibleRunner.workspacesSizeLimit | default "5Gi" }}
        - name: galaxy-cache
          {{- if .Values.ansibleRunner.galaxyCache.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.ansibleRunner.galaxyCache.existingClaim | default (printf "%s-ansible-galaxy-cache" (include "stackweaver.fullname" .)) }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.ansibleRunner.galaxyCache.sizeLimit | default "5Gi" }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.ansibleRunner.tmpSizeLimit | default "1Gi" }}
        {{- include "stackweaver.customCA.volume" . | nindent 8 }}
      {{- with .Values.ansibleRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ansibleRunner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ansibleRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
