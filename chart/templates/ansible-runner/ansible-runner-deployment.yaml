apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackweaver.fullname" . }}-ansible-runner
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: ansible-runner
spec:
  replicas: {{ .Values.ansibleRunner.replicas }}
  selector:
    matchLabels:
      {{- include "stackweaver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ansible-runner
  template:
    metadata:
      labels:
        {{- include "stackweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ansible-runner
        {{- if .Values.ansibleRunner.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.ansibleRunner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "stackweaver.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "stackweaver.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: ansible-runner
          image: "{{ .Values.ansibleRunner.image.repository }}:{{ .Values.ansibleRunner.image.tag }}"
          imagePullPolicy: {{ .Values.ansibleRunner.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: LOG_LEVEL
              value: info
            # ── Database ──
            {{- include "stackweaver.env.database" . | nindent 12 }}
            # ── Redis ──
            {{- include "stackweaver.env.redis" . | nindent 12 }}
            # ── Storage ──
            {{- include "stackweaver.env.storage" . | nindent 12 }}
            # ── Encryption ──
            {{- include "stackweaver.env.encryption" . | nindent 12 }}
            # ── OIDC Workload Identity ──
            {{- if .Values.oidc.issuerUrl }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            {{- else }}
            - name: OIDC_ISSUER_URL
              value: {{ include "stackweaver.api.url" . | quote }}
            {{- end }}
            - name: OIDC_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.oidc" . }}
                  key: {{ .Values.secrets.oidc.keys.signingKey }}
                  optional: true
            # ── Workspaces ──
            - name: WORKSPACES_DIR
              value: /home/iac/workspaces
            # ── Ansible ──
            # Default home under the writable /tmp emptyDir so Ansible can create
            # its local temp dir under the read-only root filesystem. The runner
            # overrides this per-job/per-sync onto the workspaces volume.
            - name: ANSIBLE_HOME
              value: /tmp/.ansible
            # Module "remote" temp dir. For local-connection tasks the target is
            # this read-only container, so it must live under writable /tmp.
            - name: ANSIBLE_REMOTE_TMP
              value: /tmp/.ansible/tmp
            # ── Extra env vars (user overrides) ──
            {{- range $key, $value := .Values.ansibleRunner.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: workspaces
              mountPath: /home/iac/workspaces
            - name: tmp
              mountPath: /tmp
            {{- include "stackweaver.customCA.volumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ansibleRunner.resources | nindent 12 }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ .Values.runnerWorkspaces.existingClaim | default (printf "%s-runner-workspaces" (include "stackweaver.fullname" .)) }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.ansibleRunner.tmpSizeLimit | default "1Gi" }}
        {{- include "stackweaver.customCA.volume" . | nindent 8 }}
      {{- with .Values.ansibleRunner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ansibleRunner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ansibleRunner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
