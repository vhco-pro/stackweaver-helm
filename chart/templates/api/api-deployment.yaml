apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackweaver.fullname" . }}-api
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "stackweaver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "stackweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "stackweaver.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "stackweaver.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      {{- if .Values.zitadel.bundled }}
      initContainers:
        - name: wait-for-zitadel
          image: busybox:1.36
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false  # AUD-063
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "stackweaver.fullname" . }}-zitadel:8080/debug/ready >/dev/null 2>&1; do
                echo "Waiting for Zitadel at {{ include "stackweaver.fullname" . }}-zitadel:8080..."
                sleep 3
              done
              echo "Zitadel is ready."
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false  # AUD-063
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: info
            # AUD-063/070: run the API in production mode so gin release-mode behaviors engage -
            # including denying credentialed CORS to localhost origins (production uses configured
            # origins, not localhost).
            - name: GIN_MODE
              value: release
            # ── Server ──
            - name: SERVER_HOST
              value: {{ .Values.api.server.host | default "0.0.0.0" | quote }}
            - name: SERVER_PORT
              value: {{ .Values.api.port | quote }}
            - name: SERVER_READ_TIMEOUT
              value: {{ .Values.api.server.readTimeout | default "30s" | quote }}
            - name: SERVER_WRITE_TIMEOUT
              value: {{ .Values.api.server.writeTimeout | default "30s" | quote }}
            # ── Database ──
            {{- include "stackweaver.env.database" . | nindent 12 }}
            # ── Redis ──
            {{- include "stackweaver.env.redis" . | nindent 12 }}
            # ── Zitadel ──
            - name: ZITADEL_ISSUER
              value: {{ include "stackweaver.zitadel.issuer" . | quote }}
            - name: ZITADEL_INTERNAL_ADDR
              value: {{ include "stackweaver.zitadel.internalAddr" . | quote }}
            # Round 25 hardening (item 15): NOT optional. Required for
            # backchannel-logout audience binding (OIDC §2.6 step 4 /
            # Round 23 Finding 1), when missing, any Zitadel-signed
            # logout_token from any other RP on the same instance can
            # terminate sessions in this app. The api will refuse to
            # construct the backchannel verifier in production when
            # this value is empty (panic on first use).
            - name: ZITADEL_API_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.zitadel" . }}
                  key: {{ .Values.secrets.zitadel.keys.clientId }}
            - name: ZITADEL_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.zitadel" . }}
                  key: {{ .Values.secrets.zitadel.keys.clientSecret }}
                  optional: true
            # AUD-012 audience enforcement: real user access tokens carry the
            # frontend PKCE client_id in `aud`, so the API must accept it or
            # every browser-issued token is rejected with 401 (#581). Must be a
            # secretKeyRef - zitadel-init regenerates this id on re-init, so a
            # templated literal would break on the next bootstrap.
            - name: ZITADEL_FRONTEND_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.zitadel" . }}
                  key: {{ .Values.secrets.zitadel.keys.frontendClientId }}
                  optional: true
            - name: ZITADEL_LOGIN_SERVICE_USER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.zitadel" . }}
                  key: {{ .Values.secrets.zitadel.keys.loginServiceUserToken }}
                  optional: true
            # ── Auth proxy config (custom login UI, replaces zitadel-login container) ──
            - name: STACKWEAVER_NOTIFICATION_MODE
              value: {{ .Values.api.auth.notificationMode | default "return_code" | quote }}
            - name: STACKWEAVER_DEFAULT_REDIRECT_URI
              value: {{ include "stackweaver.frontend.redirectURI" . | quote }}
            - name: STACKWEAVER_AUTO_SUBMIT_CODE
              value: {{ .Values.api.auth.autoSubmitCode | default false | quote }}
            # Forward the external host so Zitadel builds IdP callback URLs against
            # the browser-reachable domain instead of the internal service name.
            - name: CUSTOM_REQUEST_HEADERS
              value: "x-zitadel-instance-host:{{ .Values.zitadel.config.ExternalDomain | default .Values.ingress.hosts.auth }}"
            - name: ZITADEL_WEBHOOK_IDP_SYNC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.zitadel" . }}
                  key: {{ .Values.secrets.zitadel.keys.webhookIdpSyncKey }}
                  optional: true
            - name: ZITADEL_WEBHOOK_COMPLEMENT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.zitadel" . }}
                  key: {{ .Values.secrets.zitadel.keys.webhookComplementTokenKey }}
                  optional: true
            # ── Encryption ──
            {{- include "stackweaver.env.encryption" . | nindent 12 }}
            # ── Storage ──
            {{- include "stackweaver.env.storage" . | nindent 12 }}
            # ── App URL (SPA's public origin, used by the auth proxy to build IdP
            #    success/failure URLs that land on the SPA, by GitHub Setup URL
            #    relay, and by status check links) ──
            - name: STACKWEAVER_APP_URL
              value: {{ include "stackweaver.app.url" . | quote }}
            # ── GitHub App ──
            {{- if .Values.secrets.githubApp.secretName }}
            - name: GITHUB_APP_ID
              value: {{ .Values.api.githubApp.id | quote }}
            - name: GITHUB_APP_NAME
              value: {{ .Values.api.githubApp.name | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: /etc/github-app/private-key.pem
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.githubApp.secretName }}
                  key: {{ .Values.secrets.githubApp.keys.webhookSecret }}
                  optional: true
            {{- end }}
            # ── OIDC Workload Identity ──
            {{- if .Values.oidc.issuerUrl }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerUrl | quote }}
            {{- end }}
            - name: OIDC_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.oidc" . }}
                  key: {{ .Values.secrets.oidc.keys.signingKey }}
                  optional: true
            # ── CORS ──
            {{- if .Values.api.corsExtraOrigins }}
            - name: CORS_EXTRA_ORIGINS
              value: {{ .Values.api.corsExtraOrigins | quote }}
            {{- end }}
            # ── Client-IP attribution (#597) ──
            # Without trusted proxies, c.ClientIP() is the ingress pod for every
            # request: one shared per-IP rate bucket for the whole deployment and
            # collapsed per-IP security keying. Empty value omits the env var, so
            # the API falls back to its hardened trust-no-proxies default.
            {{- if .Values.api.trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.api.trustedProxies | quote }}
            {{- end }}
            # ── SSO ──
            {{- if .Values.sso.enableOidcTeamSync }}
            - name: ENABLE_OIDC_TEAM_SYNC
              value: "true"
            {{- end }}
            {{- if .Values.sso.oidcRemoveFromNonSsoTeams }}
            - name: OIDC_REMOVE_FROM_NON_SSO_TEAMS
              value: "true"
            {{- end }}
            # ── OpenTofu binary sources ──
            # Override for air-gapped installs that mirror OpenTofu internally.
            {{- if .Values.tofu.releasesUrl }}
            - name: TOFU_RELEASES_URL
              value: {{ .Values.tofu.releasesUrl | quote }}
            {{- end }}
            {{- if .Values.tofu.versionIndexUrl }}
            - name: TOFU_VERSION_INDEX_URL
              value: {{ .Values.tofu.versionIndexUrl | quote }}
            {{- end }}
            # ── Extra env vars (user overrides) ──
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secrets.githubApp.secretName }}
            - name: github-app-key
              mountPath: /etc/github-app
              readOnly: true
            {{- end }}
            {{- include "stackweaver.customCA.volumeMount" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.secrets.githubApp.secretName }}
        - name: github-app-key
          secret:
            secretName: {{ .Values.secrets.githubApp.secretName }}
            items:
              - key: {{ .Values.secrets.githubApp.keys.privateKey }}
                path: private-key.pem
        {{- end }}
        {{- include "stackweaver.customCA.volume" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
