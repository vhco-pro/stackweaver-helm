apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stackweaver.fullname" . }}-frontend-config
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  public-site-settings.conf: |
    {{- include "stackweaver.publicSite.settings" . | nindent 4 }}
  env.js: |
    // Auto-generated by StackWeaver Helm chart, do not edit
    window.__STACKWEAVER__ = {
      VITE_BASE_PATH: {{ (include "stackweaver.publicSite.values" . | fromJson).basePath | toJson }},
      VITE_API_URL: "{{ include "stackweaver.api.url" . }}",
      VITE_STACKWEAVER_AUTO_SUBMIT_CODE: "{{ .Values.api.auth.autoSubmitCode | default false }}",
    };
