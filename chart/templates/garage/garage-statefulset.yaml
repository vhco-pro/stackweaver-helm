{{- if .Values.garage.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stackweaver.fullname" . }}-garage
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  serviceName: {{ include "stackweaver.fullname" . }}-garage
  replicas: 1
  selector:
    matchLabels:
      {{- include "stackweaver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: garage
  template:
    metadata:
      labels:
        {{- include "stackweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: garage
    spec:
      {{- include "stackweaver.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: garage
          image: "{{ .Values.garage.image.repository }}:{{ .Values.garage.image.tag }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.fullname" . }}-garage
                  key: rpc-secret
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.fullname" . }}-garage
                  key: admin-token
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.fullname" . }}-garage
                  key: metrics-token
          livenessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 3900
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.garage.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage/data
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
        - name: garage-init
          image: alpine:3.23
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          command: ["/bin/sh", "-c"]
          args:
            # Bootstrap over Garage's admin API rather than its CLI. The CLI is not in the
            # dxflrs/garage image (it ships a single /garage binary on scratch, with no shell to
            # copy it out with), so the previous version downloaded it from garagehq.deuxfleurs.fr
            # at startup - which no egress-restricted cluster can reach, leaving the StatefulSet
            # at 1/2 forever with storage unconfigured. The admin API needs no egress and is
            # already enabled and authenticated in our garage.toml. The CLI bootstrap it replaces
            # was otherwise working; this is about the download, not about the CLI.
            - |
              set -eu

              # The sidecar shares the pod network namespace with the garage container, so the
              # admin listener is on loopback.
              ADMIN="http://127.0.0.1:3903"
              BUCKET="{{ .Values.storage.bucket }}"
              ZONE="dc1"
              # Derived from garage.storage.size, so the capacity the node advertises always
              # matches its PVC. Only applied on a fresh cluster (layout version 0) - resizing an
              # existing layout would trigger a rebalance and is left as a deliberate operator
              # action.
              CAPACITY={{ include "stackweaver.garage.capacityBytes" . }}
              BODY=/tmp/garage-api-body
              TRACE=/tmp/garage-api-trace

              # api <path> [json-body] - GET without a body, POST with one. Leaves the response
              # body in $BODY, the headers plus any wget error in $TRACE, and the status in
              # $STATUS. $BODY is truncated up front because busybox wget does not write the
              # output file on a non-2xx, and a stale body from the previous call would
              # otherwise be reported as this one's.
              api() {
                _path="$1"
                _body="${2:-}"
                : >"$BODY"
                if [ -n "$_body" ]; then
                  set -- --post-data "$_body" --header "Content-Type: application/json"
                else
                  set --
                fi
                wget -S -qO "$BODY" \
                  --header "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
                  "$@" "${ADMIN}${_path}" >"$TRACE" 2>&1 || true
                STATUS=$(grep -o 'HTTP/1\.[01] [0-9][0-9][0-9]' "$TRACE" | tail -1 | cut -d' ' -f2)
                [ -n "$STATUS" ]
              }

              # expect "<allowed codes>" <description> - fail loudly on anything else. The CLI
              # version ended every mutation with `2>/dev/null || true`, which hid real failures
              # as readily as the benign "already exists" ones.
              expect() {
                _allowed="$1"
                _what="$2"
                for _code in $_allowed; do
                  [ "$STATUS" = "$_code" ] && return 0
                done
                echo "FATAL: ${_what} failed with HTTP ${STATUS:-<no response>}"
                cat "$TRACE" 2>/dev/null || true
                exit 1
              }

              # Field extraction without jq: alpine has none, and apk add needs the very egress
              # we cannot assume. Garage pretty-prints its JSON, so no two fields share a line.
              json_str() { grep -o "\"$1\": *\"[^\"]*\"" "$BODY" | head -1 | sed 's/.*: *"//; s/"$//'; }
              json_num() { grep -o "\"$1\": *[0-9][0-9]*" "$BODY" | head -1 | sed 's/.*: *//'; }

              # Wait for the admin API, but only for the reasons worth waiting on. A rejected
              # token or an exhausted budget exits non-zero so the sidecar crash-loops visibly:
              # it has no readiness probe, so a container looping forever would leave the pod
              # reporting healthy with storage unconfigured.
              echo "Waiting for the Garage admin API..."
              ATTEMPTS=0
              while :; do
                if api /v2/GetClusterStatus; then
                  case "$STATUS" in
                    200) break ;;
                    401 | 403)
                      echo "FATAL: the Garage admin API rejected GARAGE_ADMIN_TOKEN (HTTP ${STATUS})"
                      exit 1
                      ;;
                  esac
                fi
                ATTEMPTS=$((ATTEMPTS + 1))
                if [ "$ATTEMPTS" -ge 150 ]; then
                  echo "FATAL: the Garage admin API did not become ready within 5 minutes"
                  echo "  last status: ${STATUS:-<no response>}"
                  # /v2 exists from Garage v2.0 onwards; a v1.x image answers 400 here because it
                  # only serves /v1. That is a pinned-tag problem, not a startup problem.
                  [ "${STATUS:-}" = "400" ] && echo "  HTTP 400 usually means garage.image.tag is a v1.x release; this bootstrap requires Garage v2.0+"
                  cat "$TRACE" 2>/dev/null || true
                  exit 1
                fi
                sleep 2
              done
              echo "Garage is ready"

              NODE_ID=$(json_str id)
              case "$NODE_ID" in
                ????????????????????????????????????????????????????????????????) ;;
                *) echo "FATAL: could not read a node id from GetClusterStatus"; cat "$BODY"; exit 1 ;;
              esac
              echo "Node ID: ${NODE_ID}"

              LAYOUT_VERSION=$(json_num layoutVersion)
              if [ "${LAYOUT_VERSION:-0}" = "0" ]; then
                echo "Configuring cluster layout..."
                api /v2/UpdateClusterLayout \
                  "{\"roles\":[{\"id\":\"${NODE_ID}\",\"zone\":\"${ZONE}\",\"capacity\":${CAPACITY},\"tags\":[]}]}"
                expect 200 "staging the cluster layout"
                api /v2/ApplyClusterLayout '{"version":1}'
                expect 200 "applying the cluster layout"
              else
                echo "Layout already configured (version ${LAYOUT_VERSION})"
              fi

              # 409 is Garage's "already exists" on both create paths, which is the normal state
              # on every restart after the first - tolerated, anything else aborts.
              echo "Importing access key..."
              api /v2/ImportKey \
                "{\"accessKeyId\":\"${STORAGE_ACCESS_KEY}\",\"secretAccessKey\":\"${STORAGE_SECRET_KEY}\",\"name\":\"stackweaver\"}"
              expect "200 409" "importing the access key"

              echo "Creating bucket..."
              api /v2/CreateBucket "{\"globalAlias\":\"${BUCKET}\"}"
              expect "200 409" "creating bucket ${BUCKET}"

              api "/v2/GetBucketInfo?globalAlias=${BUCKET}"
              expect 200 "looking up bucket ${BUCKET}"
              BUCKET_ID=$(json_str id)

              echo "Granting key access..."
              api /v2/AllowBucketKey \
                "{\"bucketId\":\"${BUCKET_ID}\",\"accessKeyId\":\"${STORAGE_ACCESS_KEY}\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}"
              expect 200 "granting key access to bucket ${BUCKET}"

              echo "Garage initialized successfully"
              # Sleep forever, sidecar must stay alive or the pod enters CrashLoopBackOff.
              # Uses zero CPU (interruptible sleep). Same pattern as zitadel-init sidecar.
              exec sleep infinity
          env:
            # Admin API only: no RPC secret, garage.toml or meta dir needed here any more, since
            # the bootstrap no longer runs the CLI against the node's own database.
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.fullname" . }}-garage
                  key: admin-token
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.storage" . }}
                  key: {{ .Values.secrets.storage.keys.accessKey }}
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "stackweaver.secrets.storage" . }}
                  key: {{ .Values.secrets.storage.keys.secretKey }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: {{ include "stackweaver.fullname" . }}-garage
        - name: tmp
          emptyDir: {}
  {{- if .Values.garage.storage.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.garage.storage.existingClaim }}
        - name: meta
          emptyDir: {}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.garage.storage.storageClass }}
        storageClassName: {{ .Values.garage.storage.storageClass | quote }}
        {{- end }}
        {{- if .Values.garage.storage.volumeName }}
        volumeName: {{ .Values.garage.storage.volumeName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.garage.storage.size }}
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.garage.storage.storageClass }}
        storageClassName: {{ .Values.garage.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: 1Gi
  {{- end }}
{{- end }}
