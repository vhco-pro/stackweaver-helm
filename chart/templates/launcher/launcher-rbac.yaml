{{/* The launchers' ServiceAccount and the namespaced Role they place job pods with (#933, D8), in
     the job namespace only and nothing cluster-scoped. The Role grants the verbs the Kubernetes
     driver calls and no more: job pods, their per-job Secrets and ServiceAccounts are read,
     listed, created by server-side apply (create and patch) and deleted; pod logs and the pod
     template ConfigMap are read. No exec, and no NetworkPolicy write: the chart owns the job
     namespace's policies (job-networkpolicy.yaml) and tells the launchers to leave them
     (RUNNER_MANAGE_NETWORK_POLICY=false). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stackweaver.launcher.serviceAccountName" . }}
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stackweaver.launcher.serviceAccountName" . }}
  namespace: {{ include "stackweaver.launcher.jobNamespace" . }}
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
rules:
  - apiGroups: [""]
    resources: ["pods", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stackweaver.launcher.serviceAccountName" . }}
  namespace: {{ include "stackweaver.launcher.jobNamespace" . }}
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stackweaver.launcher.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stackweaver.launcher.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
