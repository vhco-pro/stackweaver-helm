{{/* The OpenTofu launcher (#933, D3, D4): it registers as the deployment's hosted launcher, holds one
     long-poll heartbeat and places every job it claims in a fresh pod of its own in the job
     namespace through the Kubernetes driver. It holds no database, storage, Redis, encryption,
     OIDC signing or VCS app secret, mounts no volume of jobs, and runs no user code. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stackweaver.fullname" . }}-runner
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicas }}
  selector:
    matchLabels:
      {{- include "stackweaver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "stackweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner
      {{- with .Values.runner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "stackweaver.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "stackweaver.launcher.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: health
              containerPort: {{ .Values.launcher.healthPort }}
          env:
            - name: LOG_LEVEL
              value: info
            {{- include "stackweaver.env.launcher" . | nindent 12 }}
            - name: RUNNER_IMAGE
              value: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag }}"
            - name: RUNNER_MAX_CONCURRENT_JOBS
              value: {{ .Values.runner.maxConcurrentJobs | default 4 | quote }}
            # ── Extra env vars (user overrides) ──
            {{- range $key, $value := .Values.runner.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # ── Launcher variables handed to jobs beyond the built-in allowlist ──
            {{- with .Values.runner.runEnvPassthrough }}
            - name: STACKWEAVER_RUN_ENV_PASSTHROUGH
              value: {{ join "," . | quote }}
            {{- end }}
          {{- include "stackweaver.launcher.probes" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "stackweaver.customCA.volumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- include "stackweaver.customCA.volume" . | nindent 8 }}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
