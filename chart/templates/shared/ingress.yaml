{{- if .Values.ingress.enabled }}
# ── App Ingress (Frontend + API) ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stackweaver.fullname" . }}-app
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- include "stackweaver.ingress.appAnnotations" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.app | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.app | quote }}
      http:
        paths:
          # ── API routes (must come before frontend catch-all) ──
          # Main API
          - path: /api/v2
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          # Auth proxy (OIDC + Session API) for the custom login UI -
          # routes under /auth/* live on the API, not under /api/v2/*.
          # IMPORTANT: /auth/callback and /auth/login are SPA routes handled
          # by the frontend React Router - they must be listed BEFORE the
          # /auth catch-all so nginx matches the longer path first.
          - path: /auth/callback
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
          - path: /auth/login
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          # Terraform service discovery
          - path: /.well-known/terraform.json
            pathType: Exact
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          # OIDC discovery (Azure AD calls these to verify workload identity tokens)
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /.well-known/jwks
            pathType: Exact
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          # Terraform module registry
          - path: /v1/modules
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          # Health check
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          # ── Frontend catch-all ──
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.port }}
---
# ── Auth Ingress (Zitadel + Login UI) ────────────────────────────────────────
{{- if .Values.zitadel.bundled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stackweaver.fullname" . }}-auth
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-auth
  annotations:
    {{- include "stackweaver.ingress.authAnnotations" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.auth | quote }}
      secretName: {{ .Values.ingress.tls.authSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.hosts.auth | quote }}
      http:
        paths:
          # Zitadel catch-all (OIDC, API, admin, etc.). The login UI that used to
          # mount at /ui/v2/login was removed in favor of the Stackweaver SPA's
          # /login routes on the app host, see custom-login-ui-plan.md.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stackweaver.fullname" . }}-zitadel
                port:
                  number: 8080
{{- end }}
{{- end }}
