{{/* ── Secrets bootstrap Job ────────────────────────────────────────────── */}}
{{/* The single secret-creation path for every installer: a Helm             */}}
{{/* pre-install/pre-upgrade hook AND an ArgoCD PreSync hook at the same     */}}
{{/* time, so plain Helm, Flux, ArgoCD and `helm template | kubectl apply`   */}}
{{/* all bootstrap through the same binary. It replaces both the previous    */}}
{{/* kubectl+openssl shell script and the render-time lookup() templates     */}}
{{/* (secrets-autogenerated.yaml / garage-secret.yaml, both deleted).        */}}
{{/*                                                                        */}}
{{/* The chart owns policy only: which secrets are chart-managed and what    */}}
{{/* shape each key has, rendered below as the SECRETS_SPEC document. The    */}}
{{/* /secrets-init binary executes it - read, skip if present, otherwise     */}}
{{/* generate and create. It never updates and never overwrites, so it is    */}}
{{/* safe to re-run on every sync and every upgrade.                         */}}
{{/*                                                                        */}}
{{/* RBAC lives in secrets-init-rbac.yaml (helm weight -5 / PreSync wave -5).*/}}
{{/* The binary retries 403 while that grant propagates.                     */}}
{{/*                                                                        */}}
{{/* Both delete policies remove the previous Job before a new one is        */}}
{{/* created, so the hook can re-run and pick up secrets deleted since the   */}}
{{/* last sync. Explicit ArgoCD annotations take precedence over ArgoCD's    */}}
{{/* own mapping of helm.sh/hook, which keeps its behaviour pinned.          */}}
{{/*                                                                        */}}
{{/* Not rendered at all when every secret is user-supplied (see the         */}}
{{/* stackweaver.secretsInit.needed helper).                                 */}}
{{- if include "stackweaver.secretsInit.needed" . }}
{{/* ── SECRETS_SPEC ──────────────────────────────────────────────────────
     One entry per chart-managed secret, guarded by the same
     secrets.*.secretName conditionals the consumers use. Generator formats are
     byte-compatible with the two implementations this replaces and are pinned
     by unit tests in scripts/zitadel-init/internal/secretspec. */}}
{{- $secretSpecs := list }}
{{- if not .Values.secrets.postgresql.secretName }}
{{- $secretSpecs = append $secretSpecs (dict
    "name" (include "stackweaver.secrets.postgresql" .)
    "data" (list
      (dict "key" .Values.secrets.postgresql.keys.password "gen" "alnum" "len" 24)
    )) }}
{{- end }}
{{- if and (not .Values.secrets.storage.secretName) (eq (.Values.storage.auth | default "credentials") "credentials") }}
{{/* Garage requires key IDs in GK + 24 hex and 64-hex secret keys. */}}
{{- $secretSpecs = append $secretSpecs (dict
    "name" (include "stackweaver.secrets.storage" .)
    "data" (list
      (dict "key" .Values.secrets.storage.keys.accessKey "gen" "hex" "len" 24 "prefix" "GK")
      (dict "key" .Values.secrets.storage.keys.secretKey "gen" "hex" "len" 64)
    )) }}
{{- end }}
{{- if .Values.garage.enabled }}
{{- $secretSpecs = append $secretSpecs (dict
    "name" (printf "%s-garage" (include "stackweaver.fullname" .))
    "data" (list
      (dict "key" "rpc-secret" "gen" "hex" "len" 64)
      (dict "key" "admin-token" "gen" "alnum" "len" 32)
      (dict "key" "metrics-token" "gen" "alnum" "len" 32)
    )) }}
{{- end }}
{{- if not .Values.secrets.encryption.secretName }}
{{/* 32-byte key as a 64-char hex string. */}}
{{- $secretSpecs = append $secretSpecs (dict
    "name" (include "stackweaver.secrets.encryption" .)
    "data" (list
      (dict "key" .Values.secrets.encryption.keys.key "gen" "hex" "len" 64)
    )) }}
{{- end }}
{{- if not .Values.secrets.zitadel.secretName }}
{{/* masterkey must be exactly 32 chars; the admin password carries the "!1A"
     suffix so it satisfies Zitadel's complexity policy. The six placeholders
     start empty and are patched later by zitadel-init. */}}
{{- $secretSpecs = append $secretSpecs (dict
    "name" (include "stackweaver.secrets.zitadel" .)
    "data" (list
      (dict "key" .Values.secrets.zitadel.keys.masterkey "gen" "alnum" "len" 32)
      (dict "key" .Values.secrets.zitadel.keys.adminPassword "gen" "alnum" "len" 16 "suffix" "!1A")
      (dict "key" .Values.secrets.zitadel.keys.adminUsername "value" .Values.zitadel.init.adminUsername)
      (dict "key" .Values.secrets.zitadel.keys.clientId "value" "")
      (dict "key" .Values.secrets.zitadel.keys.clientSecret "value" "")
      (dict "key" .Values.secrets.zitadel.keys.loginServiceUserToken "value" "")
      (dict "key" .Values.secrets.zitadel.keys.frontendClientId "value" "")
      (dict "key" .Values.secrets.zitadel.keys.webhookIdpSyncKey "value" "")
      (dict "key" .Values.secrets.zitadel.keys.webhookComplementTokenKey "value" "")
    )) }}
{{- end }}
{{- if not .Values.secrets.oidc.secretName }}
{{/* RSA-2048 private key (PKCS#1 PEM) shared by api + both runners so
     workload-identity tokens verify against the API's published JWKS. */}}
{{- $secretSpecs = append $secretSpecs (dict
    "name" (include "stackweaver.secrets.oidc" .)
    "data" (list
      (dict "key" .Values.secrets.oidc.keys.signingKey "gen" "rsa-pem" "bits" 2048)
    )) }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stackweaver.fullname" . }}-secrets-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # An hour, not five minutes: a failed bootstrap must stay inspectable long
  # enough to diagnose (the previous 300s TTL destroyed the evidence).
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "stackweaver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secrets-init
    spec:
      {{- include "stackweaver.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: secrets-init
          image: "{{ .Values.secretsInit.image.repository }}:{{ .Values.secretsInit.image.tag }}"
          imagePullPolicy: {{ .Values.secretsInit.image.pullPolicy }}
          command: ["/secrets-init"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SECRETS_SPEC
              value: {{ dict "secrets" $secretSpecs | toJson | quote }}
{{- end }}
