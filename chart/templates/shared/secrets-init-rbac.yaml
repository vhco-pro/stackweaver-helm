{{/* ── Secrets-init RBAC ──────────────────────────────────────────────── */}}
{{/* Applied at helm hook weight -5 / ArgoCD PreSync wave -5, i.e. before   */}}
{{/* the secrets-init Job at weight 0.                                     */}}
{{/*                                                                       */}}
{{/* These MUST be hooks under Helm too: regular resources are applied      */}}
{{/* after the pre-install hooks run, so on a fresh install the Job would   */}}
{{/* start without any permission to read or create Secrets.               */}}
{{/*                                                                       */}}
{{/* Uses the namespace default ServiceAccount, it always exists,          */}}
{{/* eliminating any SA-creation race condition. Verbs are the minimum the  */}}
{{/* binary uses: get to decide, create to bootstrap. No update, no delete, */}}
{{/* no list - it can never read a secret it was not told the name of.     */}}
{{- if include "stackweaver.secretsInit.needed" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stackweaver.fullname" . }}-secrets-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stackweaver.fullname" . }}-secrets-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets-init
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stackweaver.fullname" . }}-secrets-init
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
{{- end }}
