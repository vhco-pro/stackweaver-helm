{{- if .Values.zitadel.bundled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stackweaver.fullname" . }}-zitadel-config
  labels:
    {{- include "stackweaver.labels" . | nindent 4 }}
    app.kubernetes.io/component: zitadel
data:
  defaults.yaml: |
    ExternalDomain: {{ if .Values.zitadel.config.ExternalDomain }}{{ .Values.zitadel.config.ExternalDomain }}{{ else }}{{ .Values.ingress.hosts.auth }}{{ end }}
    ExternalPort: {{ if .Values.zitadel.config.ExternalPort }}{{ .Values.zitadel.config.ExternalPort }}{{ else }}{{ ternary 443 80 .Values.ingress.tls.enabled }}{{ end }}
    ExternalSecure: {{ if hasKey .Values.zitadel.config "ExternalSecure" }}{{ .Values.zitadel.config.ExternalSecure }}{{ else }}{{ .Values.ingress.tls.enabled }}{{ end }}
    TLS:
      Enabled: false

    # Use pod hostname for Sonyflake machine ID instead of private IP / GCP metadata.
    # Docker Compose uses network_mode: host (host IP is visible), but in Kubernetes each
    # pod has its own network namespace and IP detection fails with "no private ip address".
    Machine:
      Identification:
        PrivateIp:
          Enabled: false
        Hostname:
          Enabled: true

    Database:
      Postgres:
        Host: {{ include "stackweaver.postgresql.host" . }}
        Port: {{ include "stackweaver.postgresql.port" . }}
        Database: zitadel
        Admin:
          Username: {{ include "stackweaver.postgresql.username" . }}
          SSL:
            Mode: {{ include "stackweaver.postgresql.sslmode" . }}
        User:
          Username: {{ include "stackweaver.postgresql.username" . }}
          SSL:
            Mode: {{ include "stackweaver.postgresql.sslmode" . }}

    # Allow Zitadel's outgoing HTTP calls (Actions V2 targets, IdP discovery)
    # to reach internal/cluster-local URLs — Zitadel → API SSO group-sync
    # webhooks call an in-cluster ClusterIP (10.0.0.0/8 on most clusters).
    # Zitadel ≥4.15.2 routes ALL such calls through a global
    # HTTPClient.DenyList that blocks RFC1918 + loopback by default; the older
    # Executions.DenyList is deprecated and MERGES INTO it, so clearing only
    # that list allows nothing (zitadel/zitadel#12326 — no allowlist exists).
    # We therefore override the deny list itself: private/loopback entries are
    # dropped, while the cloud-metadata (169.254.0.0/16 — AWS/GCP/Azure
    # 169.254.169.254) and special-range guards are kept, since those are the
    # high-value SSRF targets and are never legitimate endpoints in-cluster.
    HTTPClient:
      DenyList:
        - "0.0.0.0/8"       # Unspecified IPv4 / local routing trick
        - "100.64.0.0/10"   # Carrier-Grade NAT space
        - "169.254.0.0/16"  # Link-local incl. cloud metadata endpoints
        - "198.18.0.0/15"   # Benchmark ranges
        - "::/128"          # Unspecified IPv6
        - "fe80::/10"       # IPv6 link-local (metadata equivalent)

    DefaultInstance:
      LoginPolicy:
        AllowUsernamePassword: true
        AllowExternalIDPs: true
      Org:
        LoginPolicy:
          AllowUsernamePassword: true
      Features:
        LoginDefaultOrg: true
        LoginV2:
          Required: true
          BaseURI: {{ include "stackweaver.loginUI.baseURL" . }}
      OIDCSettings:
        AccessTokenLifetime: {{ .Values.zitadel.config.accessTokenLifetime | default "12h" }}
        IdTokenLifetime: {{ .Values.zitadel.config.idTokenLifetime | default "12h" }}
        RefreshTokenIdleExpiration: {{ .Values.zitadel.config.refreshTokenIdleExpiration | default "720h" }}
        RefreshTokenExpiration: {{ .Values.zitadel.config.refreshTokenExpiration | default "2160h" }}

  init-steps.yaml: |
    FirstInstance:
      Skip: false
      PatPath: /pat/admin.pat
      InstanceName: "StackWeaver Instance"
      DefaultLanguage: en
      Org:
        Name: ZITADEL
        Human:
          UserName: admin
          FirstName: Admin
          LastName: User
          Email:
            Address: {{ .Values.zitadel.init.adminUsername }}
            Verified: true
          # Password injected via ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD env var
          PasswordChangeRequired: false
        Machine:
          Machine:
            Username: admin
            Name: "Automatically Initialized IAM_OWNER"
          Pat:
            ExpirationDate: "2030-01-01T00:00:00Z"
{{- end }}
